match:
  min-players: 1
  hunter-count: 4
  auto-fill-bots: false
  match-time-seconds: 1200

monster:
  starting-stage: 1

  evolution-needed:
    stage-2: 100
    stage-3: 250

  # 必要Evolutionに到達しても自動では進化しない。
  # 通常プレイでは5番スロットのEVOLVEを右クリックして進化する。
  # /evolve evolve は管理者・デバッグ用として残す。開始後はキャンセル不可。
  # 進化中は開始地点に固定され、WASD・ジャンプ・ノックバックで移動できない。視点だけは自由。
  evolution-time-seconds:
    stage-2: 8
    stage-3: 12


  # 通常プレイヤーを100%としたMonsterの基本移動速度。
  movement-speed:
    stage-1: 1.20
    stage-2: 1.25
    stage-3: 1.30

  # Evolve風の2層耐久。
  # health = 本体HP（基本的に捕食では回復しない）
  # armor  = 外皮（捕食で回復する）
  vitals:
    stage-1:
      health: 100.0
      armor: 50.0
    stage-2:
      health: 140.0
      armor: 80.0
    stage-3:
      health: 180.0
      armor: 120.0
    # 捕食で得たEvolution 1ポイントにつき回復する外皮量
    armor-per-evolution: 1.0

  # 左クリック通常攻撃。スキル枠は使用せず、常に前方扇形の爪攻撃を行う。
  # widthではなくarc-degreesで角度を指定する。
  attack:
    cooldown-ticks: 16
    stage-1:
      damage: 6.0
      range: 3.2
      arc-degrees: 100.0
      height: 2.8
    stage-2:
      damage: 9.0
      range: 4.2
      arc-degrees: 110.0
      height: 3.8
    stage-3:
      damage: 12.0
      range: 5.5
      arc-degrees: 120.0
      height: 5.2

  # Goliath系Monsterの初期スキルセット。
  # Stageごとに威力・範囲・機動力が伸びる。Cooldownは全Stage共通。
  skills:
    fire-breath:
      cooldown-seconds: 10
      pulse-interval-ticks: 4
      stage-1:
        range: 7.0
        arc-degrees: 62.0
        damage-per-pulse: 1.6
        pulses: 7
        fire-ticks: 50
      stage-2:
        range: 8.0
        arc-degrees: 66.0
        damage-per-pulse: 2.0
        pulses: 7
        fire-ticks: 60
      stage-3:
        range: 9.0
        arc-degrees: 70.0
        damage-per-pulse: 2.4
        pulses: 8
        fire-ticks: 70

    leap-smash:
      cooldown-seconds: 12
      stage-1:
        forward-power: 1.45
        upward-power: 0.98
        radius: 4.2
        damage: 11.0
      stage-2:
        forward-power: 1.58
        upward-power: 1.03
        radius: 4.8
        damage: 14.0
      stage-3:
        forward-power: 1.72
        upward-power: 1.08
        radius: 5.4
        damage: 18.0

    charge:
      cooldown-seconds: 11
      stage-1:
        duration-ticks: 24
        speed: 1.24
        hit-radius: 1.7
        damage: 9.0
      stage-2:
        duration-ticks: 27
        speed: 1.32
        hit-radius: 1.85
        damage: 12.0
      stage-3:
        duration-ticks: 30
        speed: 1.40
        hit-radius: 2.0
        damage: 15.0

    rock-throw:
      cooldown-seconds: 9
      stage-1:
        velocity: 1.70
        radius: 3.2
        damage: 13.0
      stage-2:
        velocity: 1.78
        radius: 3.6
        damage: 16.0
      stage-3:
        velocity: 1.86
        radius: 4.0
        damage: 20.0

wildlife:
  test-spawn-count: 6
  corpse-expire-seconds: 120
  feed-range: 3.5
  # 捕食完了までの時間。捕食中に1でもダメージを受けると強制キャンセル。
  feed-duration-seconds: 3.0
  evolution:
    pig: 20
    cow: 25
    sheep: 20
    chicken: 10

ui:
  # Client MODの専用HUDを使うため、通常はサイドバーを表示しない。
  # scoreboard自体はClient MODへのrole/stage同期に引き続き使用する。
  sidebar: false


hunters:
  weapons:
    rifle: {damage: 4.0, range: 52.0, fire-delay-ticks: 3, reload-ticks: 32}
    shotgun: {damage: 3.0, range: 20.0, fire-delay-ticks: 16, reload-ticks: 38}
    carbine: {damage: 3.5, range: 48.0, fire-delay-ticks: 4, reload-ticks: 30}
    medic_rifle: {damage: 3.0, range: 46.0, fire-delay-ticks: 5, reload-ticks: 30}
    support_rifle: {damage: 3.5, range: 46.0, fire-delay-ticks: 4, reload-ticks: 32}
  harpoon:
    duration-ticks: 120
    max-length: 12.0
